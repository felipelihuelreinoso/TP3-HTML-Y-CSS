<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 19 - Formulario multi-step</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <form class="wizard">
    <input type="radio" name="paso" id="paso1" checked class="paso-radio">
    <input type="radio" name="paso" id="paso2" class="paso-radio">

    <section class="seccion" id="seccion1">
      <h2>Paso 1: Datos personales</h2>
      <label for="nombre">Nombre de usuario:</label>
      <input type="text" id="nombre" placeholder="Tu nombre" required>

      <label for="email">direccion de Email:</label>
      <input type="email" id="email" placeholder="tu@email.com" required>

      <label for="paso2" class="btn-siguiente">Siguiente</label>
    </section>

    <section class="seccion" id="seccion2">
      <h2>Paso 2: Contraseña</h2>
      <label for="clave">Contraseña (mín. 6 caracteres):</label>
      <input type="password" id="clave" placeholder="Contraseña" required minlength="6">

      <label for="paso1" class="btn-atras">Atrás</label>
      <button type="submit">Registrarse</button>
    </section>
  </form>
</body>
</html>
