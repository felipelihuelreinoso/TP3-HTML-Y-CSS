<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 9 - Flexbox: galería</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="gallery">
    <div class="product">
      <img src="arroz con pollo.jpeg" alt="Arroz con pollo">
      <h3>Arroz con pollo</h3>
      <p>$7000</p>
      <button>Comprar</button>
    </div>
    <div class="product">
      <img src="dona de fideos.webp" alt="Dona de Fideos">
      <h3>Dona de Fideos</h3>
      <p>$1500</p>
      <button>Comprar</button>
    </div>
    <div class="product">
      <img src="fideonaranja.jpg" alt="Fideos a la mandarina">
      <h3>Fideos a la mandarina</h3>
      <p>$4000</p>
      <button>Comprar</button>
    </div>
    <div class="product">
      <img src="gato arroz.jpg" alt="Arroz con gato">
      <h3>Arroz con gato</h3>
      <p>$10000</p>
      <button>Comprar</button>
    </div>
    <div class="product">
      <img src="salchicha con gelatina.jpg" alt="Gelatina con Sal y Chicha">
      <h3>Gelatina con Sal y Chicha</h3>
      <p>$1800</p>
      <button>Comprar</button>
    </div>
    <div class="product">
      <img src="sopabanana.jpg" alt="Estofado de Banana">
      <h3>Estofado de Banana</h3>
      <p>$5900</p>
      <button>Comprar</button>
    </div>
  </div>
</body>
</html>
